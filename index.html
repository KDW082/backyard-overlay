<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Northern Michigan's Backyard</title>
<meta name="viewport" content="width=1920, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.min.js"></script>
<style>

/* ─── RESET ─────────────────────────────────────────── */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1920px;
  height: 1080px;
  background: transparent;
  overflow: hidden;
  font-family: 'Inter', -apple-system, Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
  color: #fff;
}

/* ─── SHARED ─────────────────────────────────────────── */
:root {
  --white-90: rgba(255,255,255,0.90);
  --white-70: rgba(255,255,255,0.70);
  --white-60: rgba(255,255,255,0.60);
  --white-40: rgba(255,255,255,0.40);
  --white-20: rgba(255,255,255,0.20);
  --gold:     rgba(220,175,80,0.85);
  --ts: 0 1px 6px rgba(0,0,0,0.9), 0 0 16px rgba(0,0,0,0.6);
  --ts-light: 0 1px 4px rgba(0,0,0,0.75);
}

/* ─── TOP LEFT ───────────────────────────────────────── */
.top-left {
  position: absolute;
  top: 32px;
  left: 36px;
}

.top-left .station-name {
  font-size: 17px;
  font-weight: 300;
  color: var(--white-70);
  letter-spacing: 0.02em;
  text-shadow: var(--ts);
  line-height: 1;
}

.top-left .station-sub {
  font-size: 12px;
  font-weight: 400;
  color: var(--white-40);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-shadow: var(--ts-light);
  margin-top: 5px;
}

/* ─── TOP RIGHT ──────────────────────────────────────── */
.top-right {
  position: absolute;
  top: 28px;
  right: 36px;
  text-align: right;
}

.top-right .clock {
  font-size: 52px;
  font-weight: 300;
  color: var(--white-90);
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  text-shadow: var(--ts);
  line-height: 1;
}

.top-right .weather-line {
  font-size: 16px;
  font-weight: 400;
  color: var(--white-70);
  letter-spacing: 0.04em;
  text-shadow: var(--ts-light);
  margin-top: 7px;
}

/* ─── RIGHT SIDE DATA ────────────────────────────────── */
.right-data {
  position: absolute;
  top: 50%;
  right: 36px;
  transform: translateY(-50%);
  text-align: right;
  opacity: 0;
  transition: opacity 1.5s ease;
}
.right-data.loaded { opacity: 1; }

.right-data .data-row {
  margin-bottom: 10px;
}
.right-data .data-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  color: var(--white-40);
  text-shadow: var(--ts-light);
  margin-bottom: 2px;
}
.right-data .data-val {
  font-size: 14px;
  font-weight: 400;
  color: var(--white-60);
  letter-spacing: 0.04em;
  text-shadow: var(--ts-light);
}

/* ─── BOTTOM LEFT — EVENT DETECTION ─────────────────── */
.bottom-left {
  position: absolute;
  bottom: 72px;
  left: 36px;
  width: 480px;
}

/* STATE label — primary, instant read */
.bottom-left .event-type {
  font-size: 22px;
  font-weight: 600;
  color: var(--white-90);
  letter-spacing: 0.01em;
  text-shadow: var(--ts);
  line-height: 1.1;
  transition: opacity 0.8s ease;
}
.bottom-left .event-type.state-build    { color: rgba(220,185,80,0.95); }
.bottom-left .event-type.state-active   { color: rgba(255,255,255,0.95); }
.bottom-left .event-type.state-lull     { color: rgba(255,255,255,0.65); }
.bottom-left .event-type.state-quiet    { color: rgba(255,255,255,0.55); }
.bottom-left .event-type.state-transition { color: rgba(220,185,80,0.80); }
.bottom-left .event-type.rare           { color: rgba(140,205,170,0.95); }

/* MEANING — what it implies */
.bottom-left .event-context {
  font-size: 14px;
  font-weight: 400;
  color: var(--white-60);
  letter-spacing: 0.02em;
  text-shadow: var(--ts-light);
  margin-top: 5px;
  line-height: 1.4;
  transition: opacity 0.8s ease;
}

/* LAST EVENT — memory anchor */
.bottom-left .event-ago {
  font-size: 12px;
  font-weight: 500;
  color: var(--white-40);
  letter-spacing: 0.08em;
  text-shadow: var(--ts-light);
  margin-top: 7px;
  font-variant-numeric: tabular-nums;
}

/* ─── BOTTOM CENTER — QUOTE ──────────────────────────── */
.bottom-center {
  position: absolute;
  bottom: 68px;
  left: 50%;
  transform: translateX(-50%);
  width: 720px;
  text-align: center;
}

.bottom-center .quote {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic;
  font-size: 22px;
  font-weight: 400;
  color: var(--white-90);
  line-height: 1.4;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 8px rgba(0,0,0,0.95), 0 0 24px rgba(0,0,0,0.7);
  transition: opacity 1.4s ease;
}

.bottom-center .quote.fade { opacity: 0; }

/* ─── BOTTOM TICKER ──────────────────────────────────── */
.ticker-wrap {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 42px;
  overflow: hidden;
  background: rgba(0,0,0,0.28);
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
}

.ticker-track {
  display: flex;
  white-space: nowrap;
  animation: ticker-scroll 60s linear infinite;
  will-change: transform;
}

@keyframes ticker-scroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

.ticker-item {
  font-size: 13px;
  font-weight: 400;
  color: var(--white-60);
  letter-spacing: 0.06em;
  padding: 0 48px;
  text-shadow: var(--ts-light);
}

.ticker-item .dot {
  color: var(--white-20);
  margin: 0 6px;
}

/* ─── RARE EVENT OVERLAY (center, rare only) ─────────── */
.rare-banner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 760px;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(140,205,170,0.18);
  border-top: 2px solid rgba(140,205,170,0.38);
  padding: 34px 52px 30px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
  z-index: 20;
}
.rare-banner.active { opacity: 1; }

.rare-banner .rb-cat {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: rgba(140,205,170,0.60);
  text-shadow: var(--ts-light);
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(140,205,170,0.12);
}

.rare-banner .rb-main {
  font-size: 21px;
  font-weight: 500;
  color: var(--white-90);
  line-height: 1.4;
  text-shadow: var(--ts);
  letter-spacing: 0.01em;
}

.rare-banner .rb-sub {
  font-size: 14px;
  font-weight: 400;
  color: var(--white-60);
  margin-top: 10px;
  line-height: 1.5;
  text-shadow: var(--ts-light);
}

.rare-banner .rb-ts {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(140,205,170,0.50);
  margin-top: 18px;
  text-shadow: var(--ts-light);
}

/* ─── ANTICIPATION BADGE ─────────────────────────────── */
.anticipation {
  position: absolute;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  opacity: 0;
  transition: opacity 1.5s ease;
  pointer-events: none;
}
.anticipation.active { opacity: 1; }
.anticipation .ant-main {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  text-shadow: var(--ts);
}
.anticipation .ant-sub {
  font-size: 11px;
  font-weight: 400;
  color: var(--white-60);
  letter-spacing: 0.10em;
  text-shadow: var(--ts-light);
  margin-top: 3px;
}

/* ─── NOAA ALERT ─────────────────────────────────────── */
.noaa-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  background: rgba(200,65,45,0.18);
  border-bottom: 1px solid rgba(200,65,45,0.30);
  padding: 8px 36px;
  display: none;
  align-items: center;
  gap: 14px;
  z-index: 30;
}
.noaa-bar.active { display: flex; }
.noaa-bar .nb-lbl {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.26em; text-transform: uppercase;
  color: rgba(220,80,60,0.80);
}
.noaa-bar .nb-txt {
  font-size: 14px; font-weight: 600;
  color: rgba(235,90,70,1);
  letter-spacing: 0.04em;
}

</style>
</head>
<body>

<!-- NOAA bar (hidden until active) -->
<div class="noaa-bar" id="noaa-bar">
  <span class="nb-lbl">NWS Advisory</span>
  <span class="nb-txt" id="noaa-text">—</span>
</div>

<!-- TOP LEFT -->
<div class="top-left">
  <div class="station-name">Northern Michigan's Backyard</div>
  <div class="station-sub">Roscommon, MI &nbsp;·&nbsp; Field Station</div>
</div>

<!-- TOP RIGHT -->
<div class="top-right">
  <div class="clock" id="clock">—</div>
  <div class="weather-line" id="weather-line">—</div>
</div>

<!-- RIGHT SIDE DATA -->
<div class="right-data" id="right-data">
  <div class="data-row">
    <div class="data-label">Moon</div>
    <div class="data-val" id="moon-val">—</div>
  </div>
  <div class="data-row">
    <div class="data-label">Pressure</div>
    <div class="data-val" id="pressure-val">—</div>
  </div>
  <div class="data-row">
    <div class="data-label">Wind</div>
    <div class="data-val" id="wind-val">—</div>
  </div>
  <div class="data-row">
    <div class="data-label">Solar</div>
    <div class="data-val" id="solar-val">—</div>
  </div>
</div>

<!-- ANTICIPATION (center above quote) -->
<div class="anticipation" id="anticipation">
  <div class="ant-main" id="ant-main">—</div>
  <div class="ant-sub" id="ant-sub">—</div>
</div>

<!-- RARE EVENT BANNER (center, temporary) -->
<div class="rare-banner" id="rare-banner">
  <div class="rb-cat" id="rb-cat">—</div>
  <div class="rb-main" id="rb-main">—</div>
  <div class="rb-sub" id="rb-sub">—</div>
  <div class="rb-ts" id="rb-ts">—</div>
</div>

<!-- BOTTOM LEFT — event detection -->
<div class="bottom-left">
  <div class="event-type" id="ev-type">Observation window open</div>
  <div class="event-context" id="ev-context">No events logged this session</div>
  <div class="event-ago" id="ev-ago"></div>
</div>

<!-- BOTTOM CENTER — quote -->
<div class="bottom-center">
  <div class="quote" id="quote">—</div>
</div>

<!-- BOTTOM TICKER -->
<div class="ticker-wrap">
  <div class="ticker-track" id="ticker-track">
    <!-- populated by JS -->
  </div>
</div>

<script>
/* ================================================================
   NORTHERN MICHIGAN'S BACKYARD v6
   Clean broadcast. Tesla/DJI/Apple aesthetic.
   12-hour time. Minimal zones. Wildlife is the hero.
   ================================================================ */

const LAT = 44.48, LON = -84.72;
const ELDER_ENDPOINT = '/.netlify/functions/elder-voice';
const EBIRD_KEY = '';
const NOAA_ZONE = 'MIZ037';

const state = {
  weather: null,
  elderPool: [],
  lastElderIdx: -1,
  lastEchoAt: null,
  feederQuietSince: Date.now() - 60000*(10+Math.floor(Math.random()*30)),
  feederActive: false,
  sessionStart: Date.now(),
  pressureTrend: [],
  rareLog: [],
};

// ── 12-HOUR CLOCK ──────────────────────────────────────
function updateClock() {
  const now = new Date();
  let h = now.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m}:${s} ${ampm}`;
  updateAnticipation(now);
}
setInterval(updateClock, 1000);
updateClock();

// ── SOLAR + LUNAR ──────────────────────────────────────
function updateSolar() {
  const now = new Date();
  const sun = SunCalc.getPosition(now, LAT, LON);
  const moon = SunCalc.getMoonIllumination(now);
  const alt = sun.altitude * 180 / Math.PI;

  const lightLabel = alt < -12 ? 'Night'
    : alt < -6  ? 'Astronomical twilight'
    : alt < -0.833 ? (now < SunCalc.getTimes(now,LAT,LON).solarNoon ? 'Pre-dawn' : 'Dusk')
    : alt < 6   ? 'Golden hour'
    : alt < 20  ? 'Low sun'
    : 'Solar maximum';

  document.getElementById('solar-val').textContent = `${lightLabel} · ${alt >= 0 ? '+' : ''}${alt.toFixed(1)}°`;

  const moonPhase = moonName(moon.phase);
  const illum = (moon.fraction * 100).toFixed(0);
  document.getElementById('moon-val').textContent = `${moonPhase} · ${illum}%`;

  document.getElementById('right-data').classList.add('loaded');
}

function moonName(p) {
  if (p<0.03||p>0.97) return 'New Moon';
  if (p<0.22) return 'Waxing Crescent';
  if (p<0.28) return 'First Quarter';
  if (p<0.47) return 'Waxing Gibbous';
  if (p<0.53) return 'Full Moon';
  if (p<0.72) return 'Waning Gibbous';
  if (p<0.78) return 'Last Quarter';
  return 'Waning Crescent';
}

setInterval(updateSolar, 30000);
updateSolar();

// ── WEATHER ────────────────────────────────────────────
function compassDir(deg) {
  return ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(deg/22.5)%16];
}

async function updateWeather() {
  try {
    const r = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
      +`&current=temperature_2m,wind_speed_10m,wind_direction_10m,`
      +`wind_gusts_10m,pressure_msl,cloud_cover,weather_code`
      +`&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FDetroit`
    );
    const d = await r.json();
    const c = d.current;
    state.weather = c;

    state.pressureTrend.push({t:Date.now(), p:c.pressure_msl});
    if (state.pressureTrend.length > 8) state.pressureTrend.shift();

    const sky = skyLabel(c.weather_code, c.cloud_cover);
    document.getElementById('weather-line').textContent =
      `${c.temperature_2m.toFixed(0)}°  ·  ${sky}`;

    const trend = pressureTrend();
    document.getElementById('pressure-val').textContent =
      `${(c.pressure_msl*0.02953).toFixed(2)} inHg · ${trend}`;

    const wdir = compassDir(c.wind_direction_10m);
    document.getElementById('wind-val').textContent =
      c.wind_speed_10m < 1 ? 'Calm' : `${c.wind_speed_10m.toFixed(0)} mph ${wdir}`;

    buildTicker(c);
  } catch(e) { console.warn('weather:', e); }
}

function skyLabel(code, cloud) {
  if ([0].includes(code)) return 'Clear';
  if ([1].includes(code)) return 'Mainly Clear';
  if ([2].includes(code)) return 'Partly Cloudy';
  if ([3].includes(code)) return 'Overcast';
  if ([45,48].includes(code)) return 'Fog';
  if ([51,53,55,56,57].includes(code)) return 'Drizzle';
  if ([61,63,65,66,67,80,81,82].includes(code)) return 'Rain';
  if ([71,73,75,77,85,86].includes(code)) return 'Snow';
  if ([95,96,99].includes(code)) return 'Thunderstorm';
  return `${cloud}% Cloud`;
}

function pressureTrend() {
  if (state.pressureTrend.length < 2) return 'stable';
  const d = state.pressureTrend[state.pressureTrend.length-1].p - state.pressureTrend[0].p;
  if (d > 2) return 'rising';
  if (d < -2) return 'falling';
  return 'stable';
}

updateWeather();
setInterval(updateWeather, 10*60*1000);

// ── TICKER ─────────────────────────────────────────────
// ── TICKER CONTENT ─────────────────────────────────────
const TICKER_ALWAYS = [
  'Higgins Lake · avg depth 101 ft · maximum 135 ft · among the clearest lakes in Michigan',
  'Roscommon County · approximately 70% forested · mixed conifer and northern hardwood',
  'White-tailed deer movement peaks at dawn and dusk year-round — most crossings occur within 40 min of each',
  'Black-capped chickadees are year-round residents and typically the first species to return to a feeder after disturbance',
  'Great Horned Owls begin nesting in January — among the earliest breeding birds in Michigan',
  'Red squirrels maintain year-round territories and scatter-cache food in multiple locations',
  'Pileated woodpecker excavations are rectangular · all other local woodpeckers leave round or oval cavities',
  'Most feeder bursts last 2–4 minutes and follow a consistent species sequence — dominant birds typically arrive last',
  'A falling barometer typically drives increased feeding behavior 6–12 hours before a front arrives',
  'Coyotes are most vocal between midnight and 3am · calls serve territorial and group coordination functions',
  'Hemlock stands maintain cooler understory temperatures year-round — preferred summer bedding cover for deer',
  'Experienced observers tend to detect movement patterns earlier — longer sessions compound awareness',
  'Most noticeable changes in wildlife behavior occur during low-traffic viewing hours',
  'Activity often increases following extended quiet intervals — prolonged lulls commonly precede arrival bursts',
  'Barometric pressure changes are typically registered by wildlife before they appear on instruments',
];

const TICKER_SEASONAL = {
  spring: [
    'Spring warbler migration · Roscommon County · peak late April to mid-May — 30+ species possible in a single morning',
    'Common Loon return window · Higgins Lake · historical average arrival: April 18',
    'American Woodcock display flights begin at dusk · males spiral silently upward then descend calling',
    'Ice-out on inland lakes triggers a rapid shift in waterfowl and predator distribution',
    'Morel mushrooms appear in mixed hardwood stands after the first sustained nights above 50°F',
    'Fiddlehead ferns and trout lilies are reliable spring phenology markers on the forest floor',
  ],
  summer: [
    'Fawn season · does keep newborns in separate locations for the first 2–3 weeks — reduced adult movement near bedding areas',
    'Firefly peak typically occurs in the second week of June at this latitude',
    'Dragonfly activity peaks in July along lake margins — 30+ species recorded at Higgins Lake',
    'Ruby-throated Hummingbirds are regular feeder visitors June through August · males depart first in late July',
    'Blue Jays begin caching sunflower seeds in August — visible increase in canopy and feeder activity',
    'Young-of-year deer become increasingly visible in July as does allow more independent movement',
  ],
  autumn: [
    'Hawk migration corridor active · September · Broad-winged Hawks move in large numbers on thermal days',
    'Peak fall color · Roscommon County · swamp maples turn first · sugar maples peak late September',
    'Rut peak · October 20 – November 20 · bucks most active at dawn and dusk · expect increased trail crossings',
    'Pre-rut scrape activity begins in early October · bucks create ground scrapes along established travel corridors',
    'Late waterfowl migration · diving ducks move through in November as inland lakes begin to freeze',
    'Red squirrel caching activity peaks in September and October · consistent canopy and ground movement',
  ],
  winter: [
    'Deep winter feeder anchors · Black-capped Chickadee and White-breasted Nuthatch are the most reliable year-round species',
    'Ice formation begins in sheltered bays · typically 2–3 weeks before open basin ice-over on Higgins Lake',
    'Deer yard up in dense conifer cover during deep snow — movement becomes predictable and trail-following',
    'Winter finch irruptions · Pine Siskins and Common Redpolls appear in irregular years when northern seed crops fail',
    'Tracks in fresh snow reveal nocturnal movement patterns invisible during daylight observation windows',
    'Great Horned Owls are already incubating eggs in January · territorial calls most frequent at dusk',
  ],
};

function currentSeason() {
  const m = new Date().getMonth();
  if (m < 2 || m === 11) return 'winter';
  if (m < 5) return 'spring';
  if (m < 8) return 'summer';
  return 'autumn';
}

function buildTicker(weather) {
  const items = [...TICKER_ALWAYS];

  // Live weather first
  if (weather) {
    const sky = skyLabel(weather.weather_code, weather.cloud_cover);
    items.unshift(`Roscommon, MI  ·  ${weather.temperature_2m.toFixed(0)}°F  ·  ${sky}`);
  }

  // Seasonal content
  const seasonal = TICKER_SEASONAL[currentSeason()] || [];
  items.push(...seasonal);

  // Active phenology
  activePhenology().forEach(p => items.push(p.n));

  // Shuffle everything after the live weather item
  const live = items[0];
  const rest = items.slice(1).sort(() => Math.random() - 0.5);
  const shuffled = [live, ...rest];

  // Double for seamless loop
  const track = document.getElementById('ticker-track');
  track.innerHTML = [...shuffled, ...shuffled]
    .map(item => `<span class="ticker-item">${item}<span class="dot"> · </span></span>`)
    .join('');

  track.style.animationDuration = `${Math.max(55, shuffled.length * 9)}s`;
}

// ── ANTICIPATION STRIP ─────────────────────────────────
function updateAnticipation(now) {
  const strip = document.getElementById('anticipation');
  const main = document.getElementById('ant-main');
  const sub = document.getElementById('ant-sub');
  const times = SunCalc.getTimes(now, LAT, LON);
  const minsToSunrise = (times.sunrise - now) / 60000;
  const minsToSunset = (times.sunset - now) / 60000;
  const h = now.getHours();

  if (minsToSunrise > 0 && minsToSunrise < 35) {
    main.textContent = `Dawn window · ${Math.round(minsToSunrise)} min`;
    sub.textContent = 'Wildlife movement increases at first light';
    strip.classList.add('active');
  } else if (minsToSunset > 0 && minsToSunset < 40) {
    main.textContent = `Dusk window · ${Math.round(minsToSunset)} min`;
    sub.textContent = 'Most active period of the day approaching';
    strip.classList.add('active');
  } else if (h >= 5 && h < 7) {
    main.textContent = 'Dawn window active';
    sub.textContent = 'Peak morning movement period';
    strip.classList.add('active');
  } else if (h >= 17 && h < 19) {
    main.textContent = 'Dusk window active';
    sub.textContent = 'Wildlife most active at first and last light';
    strip.classList.add('active');
  } else {
    strip.classList.remove('active');
  }
}

// ── NOAA ───────────────────────────────────────────────
async function updateNOAA() {
  try {
    const r = await fetch(`https://api.weather.gov/alerts/active?zone=${NOAA_ZONE}`,
      {headers:{'Accept':'application/geo+json','User-Agent':'backyard-overlay/6.0'}});
    const d = await r.json();
    const alerts = (d.features||[]).filter(f =>
      ['Warning','Watch','Advisory'].some(t=>f.properties.event.includes(t)));
    const bar = document.getElementById('noaa-bar');
    if (alerts.length) {
      document.getElementById('noaa-text').textContent = alerts[0].properties.event.toUpperCase();
      bar.classList.add('active');
    } else {
      bar.classList.remove('active');
    }
  } catch(e) {}
}
updateNOAA();
setInterval(updateNOAA, 15*60*1000);

// Last event memory — stores what actually happened, not just when
const lastEvent = {
  at: null,
  label: null,         // what fired
  stateAtTime: null,   // what state was active
};

// State engine — reads environment, returns current state + subtype
function computeState() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  const w = state.weather;
  const wind = w ? w.wind_speed_10m : 0;
  const trend = pressureTrend();
  const feederQuietMin = Math.floor((Date.now() - state.feederQuietSince) / 60000);
  const period = currentPeriod();

  const times = SunCalc.getTimes(now, LAT, LON);
  const minsToSunrise = (times.sunrise - now) / 60000;
  const minsToSunset  = (times.sunset  - now) / 60000;

  // ACTIVE — dawn/dusk windows in progress
  if (h >= 5 && h < 8 && minsToSunrise < 10)
    return { state: 'ACTIVE', sub: 'dawn' };
  if (h >= 17 && h < 20 && minsToSunset > -20 && minsToSunset < 40)
    return { state: 'ACTIVE', sub: 'dusk' };

  // ACTIVE — pre-front surge
  if (trend === 'falling' && feederQuietMin < 15)
    return { state: 'ACTIVE', sub: 'pre_front' };

  // BUILD — pre-dawn approach
  if (minsToSunrise > 0 && minsToSunrise < 35)
    return { state: 'BUILD', sub: 'pre_dawn' };

  // BUILD — pre-dusk approach
  if (minsToSunset > 0 && minsToSunset < 45)
    return { state: 'BUILD', sub: 'pre_dusk' };

  // BUILD — pressure dropping (front incoming)
  if (trend === 'falling')
    return { state: 'BUILD', sub: 'pressure_drop' };

  // BUILD — extended feeder quiet
  if (feederQuietMin > 45 && period !== 'night')
    return { state: 'BUILD', sub: 'post_quiet' };

  // LULL — recent active burst cooling
  if (lastEvent.at && (Date.now() - lastEvent.at) < 8 * 60000 &&
      lastEvent.stateAtTime === 'ACTIVE')
    return { state: 'LULL', sub: 'default' };

  // TRANSITION — golden hour light shift
  if (h >= 6 && h < 7 || h >= 19 && h < 20)
    return { state: 'TRANSITION', sub: 'light' };

  // TRANSITION — weather changing
  if (trend === 'rising' && w && w.wind_speed_10m > 10)
    return { state: 'TRANSITION', sub: 'weather' };

  // QUIET — midday suppression
  if (h >= 11 && h < 15)
    return { state: 'QUIET', sub: 'midday' };

  // QUIET — overnight
  if (h < 5 || h >= 22)
    return { state: 'QUIET', sub: 'night' };

  // Default quiet
  return { state: 'QUIET', sub: 'default' };
}

// Pick a line from the state pool, avoid repeating
const lastStateLineIdx = {};
function pickStateLine(stateKey, subKey) {
  const pool = STATES[stateKey][subKey] || STATES[stateKey].default || STATES[stateKey][Object.keys(STATES[stateKey])[0]];
  const key = `${stateKey}_${subKey}`;
  let idx;
  do { idx = Math.floor(Math.random() * pool.length); }
  while (pool.length > 1 && idx === lastStateLineIdx[key]);
  lastStateLineIdx[key] = idx;
  return pool[idx];
}

// Render the bottom-left state module
function renderState() {
  const { state: s, sub } = computeState();
  const line = pickStateLine(s, sub);

  const typeEl = document.getElementById('ev-type');
  const ctxEl  = document.getElementById('ev-context');

  typeEl.textContent = line.label;
  typeEl.className   = `event-type state-${s.toLowerCase()}`;
  ctxEl.textContent  = line.meaning;
}

// Last-event memory ticker
function tickLastEvent() {
  const agoEl = document.getElementById('ev-ago');
  if (!lastEvent.at || !lastEvent.label) { agoEl.textContent = ''; return; }
  const ago = Math.floor((Date.now() - lastEvent.at) / 1000);
  const agoStr = ago < 60
    ? `${ago}s ago`
    : `${Math.floor(ago/60)}m ${String(ago%60).padStart(2,'0')}s ago`;
  agoEl.textContent = `${lastEvent.label} · ${agoStr}`;
}

// Log an event into memory
function logEvent(label) {
  lastEvent.at    = Date.now();
  lastEvent.label = label;
  lastEvent.stateAtTime = computeState().state;
  // Immediately re-render so the new timestamp shows
  tickLastEvent();
}

// Simulated event pool — fires on jittered timer, logs into memory
const SIM_EVENTS = {

  morning:   ['Chickadee rotation · feeder','Woodpecker drumming · mid-canopy','Jay intrusion · brief','Crow vocalization · distant'],

  afternoon: ['Understory movement increasing','Shadow shift noted','Wind shift · northwest'],
  dusk:      ['Deer approach · understory','Evening sequence beginning','Last jay departure · feeder quiet'],
};

function fireSimEvent() {
  const pool = SIM_EVENTS[currentPeriod()] || SIM_EVENTS.midday;
  const label = pool[Math.floor(Math.random() * pool.length)];
  logEvent(label);
  // Render state immediately after event so context is fresh
  renderState();
}

function scheduleSimEvent() {
  const p = currentPeriod();
  const base = p === 'night' ? 280 : p === 'dawn' || p === 'dusk' ? 90 : 150;
  const delay = (base + Math.random() * 160) * 1000;
  setTimeout(() => { fireSimEvent(); scheduleSimEvent(); }, delay);
}

// State re-evaluates every 60s and on any event
setInterval(() => { renderState(); }, 60000);
setInterval(tickLastEvent, 1000);

// Bootstrap
scheduleSimEvent();
fireSimEvent();
renderState();

// Rare event fires also log to memory
function fireRare(ev) {
  const period = currentPeriod();
  const pool = RARE[period] || RARE.night;
  const e = ev || pool[Math.floor(Math.random()*pool.length)];
  const now = new Date();
  let h = now.getHours(); const ampm = h>=12?'PM':'AM'; h = h%12||12;
  const ts = `${h}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')} ${ampm}`;

  document.getElementById('rb-cat').textContent = e.cat;
  document.getElementById('rb-main').textContent = e.main;
  document.getElementById('rb-sub').textContent = e.sub;
  document.getElementById('rb-ts').textContent = `Logged · ${ts} · classification pending`;
  document.getElementById('rare-banner').classList.add('active');

  // State module: mark as rare
  document.getElementById('ev-type').textContent = e.cat;
  document.getElementById('ev-type').className = 'event-type rare';
  document.getElementById('ev-context').textContent = e.sub.split('.')[0]+'.';
  logEvent(e.cat);

  state.rareLog.push({ts, cat: e.cat});
  setTimeout(() => {
    document.getElementById('rare-banner').classList.remove('active');
    renderState(); // restore state module after rare banner clears
  }, 24000);
}

function scheduleRare() {
  const h = new Date().getHours();
  const base = (h>=5&&h<8)||(h>=17&&h<20) ? 32 : h>=8&&h<17 ? 65 : 100;
  setTimeout(() => { fireRare(); scheduleRare(); }, (base + Math.random()*40)*60000);
}
scheduleRare();

function scheduleBigfoot() {
  setTimeout(() => { fireRare(BIGFOOT); scheduleBigfoot(); }, (400+Math.random()*220)*60000);
}
scheduleBigfoot();

// ── CLAUDE HYDRATION ───────────────────────────────────
async function hydrateElder() {
  if (!state.weather) return;
  try {
    const c = state.weather;
    const m = new Date().getMonth();
    const season = m<2||m===11?'winter':m<5?'spring':m<8?'summer':'autumn';
    const ctx = {
      location: 'Higgins Lake, Roscommon County, Michigan',
      time: new Date().toISOString(),
      period: currentPeriod(),
      season,
      weather: {
        temp_f: c.temperature_2m,
        wind_mph: c.wind_speed_10m,
        wind_dir: compassDir(c.wind_direction_10m),
        sky_code: c.weather_code,
        cloud_pct: c.cloud_cover,
        pressure_hpa: c.pressure_msl,
        pressure_trend: pressureTrend(),
      },
      phenology: activePhenology().map(p=>p.n).slice(0,2),
      rare_events_session: state.rareLog.length,
    };
    const r = await fetch(ELDER_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(ctx),
    });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    if (Array.isArray(data.lines) && data.lines.length) {
      state.elderPool = [...data.lines, ...ELDER_SEED];
    }
  } catch(e) { /* seed fallback */ }
}
setTimeout(() => { hydrateElder(); setInterval(hydrateElder, 14*60*1000); }, 10000);

  {s:[3,1],e:[3,21],n:'Ice-out window open · Roscommon County'},

  {s:[4,10],e:[4,25],n:'Common Loon return window · Higgins Lake avg Apr 18'},

  {s:[5,1],e:[5,20],n:'Morel season · mixed hardwood and pine stands'},
  {s:[5,25],e:[6,15],n:'Firefly first appearance window · avg June 9'},
  {s:[6,15],e:[7,10],n:'Fawn season · does with newborns · high alert'},
  {s:[8,1],e:[9,1],n:'Perseid meteor shower · peak Aug 12 · best 2–4am'},
  {s:[8,20],e:[9,20],n:'Early color change begins · swamp maples first'},
  {s:[9,1],e:[10,1],n:'Hawk migration corridor active · broad-winged, sharp-shinned'},
  {s:[9,15],e:[10,15],n:'Peak fall color · Roscommon County avg late Sept–early Oct'},
  {s:[10,20],e:[11,20],n:'Rut peak · maximum deer movement · dawn and dusk'},
  {s:[12,10],e:[1,10],n:'Ice formation begins · bays freeze before basins'},
  {s:[1,15],e:[2,28],n:'Deep winter · chickadee and nuthatch primary feeder visitors'},
];
function activePhenology() {
  const now=new Date(), m=now.getMonth()+1, d=now.getDate();
  const n=(mo,da)=>mo*100+da, cur=n(m,d);
  return PHENOLOGY.filter(p=>{
    const s=n(p.s[0],p.s[1]),e=n(p.e[0],p.e[1]);
    return s<=e?cur>=s&&cur<=e:cur>=s||cur<=e;
  });
}
