<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Northern Michigan's Backyard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{width:100%;height:100%;}
body{
  width:1920px;height:1080px;background:transparent;overflow:hidden;
  font-family:'DM Sans',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  color:#fff;transform-origin:top left;
}
body.debug{background:#091523!important;}
:root{
  --blue-d:rgba(0,34,80,0.90);
  --border:rgba(110,165,255,0.22);
  --border-hi:rgba(150,195,255,0.32);
  --blur:blur(20px) saturate(1.5);
  --r:18px;--r-sm:12px;
  --w:rgba(255,255,255,1);
  --w9:rgba(255,255,255,0.90);
  --w7:rgba(255,255,255,0.70);
  --w5:rgba(255,255,255,0.50);
  --gold:rgb(228,182,68);
  --gold2:rgba(228,182,68,0.65);
  --ts:0 2px 14px rgba(0,0,0,0.75),0 1px 3px rgba(0,0,0,0.95);
}

/* BAR */
.bar{
  position:absolute;top:18px;left:20px;right:20px;height:96px;
  background:var(--blue-d);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border-hi);border-radius:var(--r);
  display:flex;align-items:stretch;z-index:10;overflow:hidden;
  box-shadow:0 4px 36px rgba(0,0,0,0.40),inset 0 1px 0 rgba(150,195,255,0.15);
}
.bar-title{
  font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:42px;
  color:var(--w);text-shadow:var(--ts);
  padding:0 32px;white-space:nowrap;flex-shrink:0;
  border-right:1px solid var(--border);
  display:flex;align-items:center;
}
.bar-scroll{
  flex:1;overflow:hidden;position:relative;display:flex;align-items:center;
}
.bar-track{
  display:flex;align-items:center;white-space:nowrap;
  position:absolute;left:0;
  animation:marquee 120s linear infinite;
  will-change:transform;
}
@keyframes marquee{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}
.bar-item{
  font-size:28px;font-weight:500;color:var(--w9);
  letter-spacing:0.02em;padding:0 44px;text-shadow:var(--ts);flex-shrink:0;
}
.bar-item.live{opacity:1;}
.bar-item.dim{opacity:.62;font-style:italic;}
.bar-sep{color:rgba(150,195,255,0.30);padding:0 2px;}
.bar-time{
  padding:0 28px;flex-shrink:0;text-align:right;
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;align-items:flex-end;justify-content:center;
}
.bar-clock{
  font-size:34px;font-weight:400;color:var(--w);
  font-variant-numeric:tabular-nums;text-shadow:var(--ts);line-height:1.1;letter-spacing:0.02em;
}
.bar-date{
  font-size:20px;font-weight:400;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--w5);text-shadow:var(--ts);margin-top:3px;
}

/* NOAA */
.noaa-bar{
  position:absolute;top:126px;left:20px;right:20px;
  background:rgba(195,50,28,0.22);border:1px solid rgba(195,50,28,0.36);
  border-radius:var(--r-sm);padding:8px 30px;display:none;align-items:center;gap:14px;z-index:10;
}
.noaa-bar.active{display:flex;}
.nb-lbl{font-size:28px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(218,76,58,0.82);}
.nb-txt{font-size:32px;font-weight:700;color:rgb(228,82,62);}

/* WINDOW OF INTEREST */
.window-interest{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);
  text-align:center;opacity:0;transition:opacity 1.8s ease;pointer-events:none;z-index:20;
}
.window-interest.active{opacity:1;}
.wi-ey{font-size:28px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold2);text-shadow:var(--ts);margin-bottom:12px;}
.wi-main{
  font-family:'DM Serif Display',Georgia,serif;font-size:64px;font-style:italic;font-weight:400;
  color:var(--w);line-height:1.1;text-shadow:0 2px 28px rgba(0,0,0,1),0 0 70px rgba(0,0,0,0.95);
}
.wi-sub{font-size:28px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,.75);text-shadow:var(--ts);margin-top:12px;}
.wi-count{font-size:46px;font-weight:300;color:var(--gold);text-shadow:var(--ts);margin-top:8px;font-variant-numeric:tabular-nums;}

/* MILESTONE */
.milestone{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;opacity:0;pointer-events:none;transition:opacity 0.8s ease;z-index:19;
}
.milestone.active{opacity:1;}
.ms-text{
  font-size:30px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--w9);
  text-shadow:var(--ts);background:var(--blue-d);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:14px 30px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-title">Northern Michigan's Backyard</div>
  <div class="bar-scroll">
    <div class="bar-track" id="bar-track"></div>
  </div>
  <div class="bar-time">
    <div class="bar-clock" id="clock">—</div>

<div class="window-interest" id="window-interest">

function pad(n){return String(n).padStart(2,'0');}
function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function tokenize(s){return String(s).toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);}
function opener(s){return tokenize(s).slice(0,2).join(' ');}
function period(){
  const h=new Date().getHours();
  if(h<5)return'night';
  if(h<8)return'dawn';
  if(h<12)return'morning';
  if(h<15)return'midday';
  if(h<19)return'afternoon';
  if(h<22)return'dusk';
  return'night';
}
function season(){
  const m=new Date().getMonth();
  if(m<2||m===11)return'winter';
  if(m<5)return'spring';
  if(m<8)return'summer';
  return'autumn';
}
function compassDir(d){
  return ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d/22.5)%16];
}
function pTrend(){
  if(S.pressureTrend.length<2)return'stable';
  const d=S.pressureTrend[S.pressureTrend.length-1].p-S.pressureTrend[0].p;
  if(d>2)return'rising';
  if(d<-2)return'falling';
  return'stable';
}
function phenNow(){
  const now=new Date(),m=now.getMonth()+1,d=now.getDate();
  const n=(a,b)=>a*100+b,cur=n(m,d);
  return PHENOLOGY.filter(p=>{
    const s=n(p.s[0],p.s[1]),e=n(p.e[0],p.e[1]);
    return s<=e?cur>=s&&cur<=e:cur>=s||cur<=e;
  });
}
function lineSimilarity(a,b){
  const A=new Set(tokenize(a)),B=new Set(tokenize(b));
  if(!A.size||!B.size)return 0;
  let overlap=0;
  A.forEach(t=>{if(B.has(t))overlap++;});
  const j=overlap/(A.size+B.size-overlap);
  const prefix=opener(a)&&opener(a)===opener(b)?0.25:0;
  const len=Math.abs(a.length-b.length)<8?0.1:0;
  return j+prefix+len;
}
function skyL(code,cloud){
  if([0].includes(code))return'Clear';
  if([1].includes(code))return'Mainly clear';
  if([2].includes(code))return'Partly cloudy';
  if([3].includes(code))return'Overcast';
  if([45,48].includes(code))return'Fog';
  if([51,53,55].includes(code))return'Drizzle';
  if([61,63,65,80,81,82].includes(code))return'Rain';
  if([71,73,75,77].includes(code))return'Snow';
  if([95,96,99].includes(code))return'Thunderstorm';
  return`${cloud}% cloud`;
}
function windL(mph){
  if(mph<1)return'No surface movement';
  if(mph<5)return'Barely perceptible';
  if(mph<10)return'Leaves stirring';
  if(mph<15)return'Small branches moving';
  if(mph<20)return'Canopy active';
  return'Sustained canopy motion';
}
function moonName(p){
  if(p<0.03||p>0.97)return'New Moon';
  if(p<0.22)return'Waxing Crescent';
  if(p<0.28)return'First Quarter';
  if(p<0.47)return'Waxing Gibbous';
  if(p<0.53)return'Full Moon';
  if(p<0.72)return'Waning Gibbous';
  if(p<0.78)return'Last Quarter';
  return'Waning Crescent';
}
function scaleOverlay(){
  const sx=window.innerWidth/1920,sy=window.innerHeight/1080,sc=Math.min(sx,sy);
  document.body.style.transform=`scale(${sc})`;
  document.body.style.marginLeft=`${(window.innerWidth-1920*sc)/2}px`;
  document.body.style.marginTop=`${(window.innerHeight-1080*sc)/2}px`;
}
function showC(el,ms,cb){
  if(S.centerBusy)return false;
  S.centerBusy=true;
  el.classList.add('active');
  setTimeout(()=>{
    el.classList.remove('active');
    setTimeout(()=>{
      S.centerBusy=false;
      if(cb)cb();
    },1200);
  },ms);
  return true;
}
function rememberLine(item){
  S.lineHistory.push(item.t);
  if(S.lineHistory.length>120)S.lineHistory.shift();
  S.modeHistory.push(item.mode||item.type||'misc');
  if(S.modeHistory.length>120)S.modeHistory.shift();
  S.recentOpeners.push(opener(item.t));
  if(S.recentOpeners.length>40)S.recentOpeners.shift();
}
function normalizeElderLines(lines){
  return(lines||[]).map(l=>{
    if(typeof l==='string')return{text:l,mode:'quiet_narrative'};
    return{text:l.text||l.line||'',mode:l.mode||'quiet_narrative'};
  }).filter(x=>x.text);
}
function dialNarrator(text){
  if(!text)return text;
  let out=text.trim();
  const kills=['beautiful','amazing','perfect','magical','peaceful','serene','escape','getaway','experience'];
  kills.forEach(w=>{
    const r=new RegExp(`\\b${w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'gi');
    out=out.replace(r,'');
  });
  const swaps=[
    [/\bstarting to\b/gi,'beginning to'],
    [/\bholding at\b/gi,'sitting at'],
    [/\bconditions like this\b/gi,'this setup'],
    [/\bseasonal traffic\b/gi,'more traffic'],
    [/\bshoreline\b/gi,'water']
  ];
  swaps.forEach(([a,b])=>out=out.replace(a,b));
  out=out.replace(/\s+/g,' ').replace(/\s+([,.—])/g,'$1').trim();
  if(out.length>92){
    const cut=out.lastIndexOf(' ',88);
    out=out.slice(0,cut>55?cut:88).trim();
  }
  if(out&&!/[.!?]$/.test(out))out+='.';
  return out.charAt(0).toUpperCase()+out.slice(1);
}
function lineFitsCurrentContext(text){
  const lc=String(text).toLowerCase();
  const s=season(),p=period();
  const seasonConflicts={
    spring:['rut','fall color','deep winter','ski','fresh snow','ice formation'],
    summer:['rut','fall color','deep winter','fresh snow','ski','ice formation','ice-out'],
    autumn:['deep winter','fresh snow','ski','ice formation','spring warbler','ice-out'],
    winter:['dock coffee','boating','golf','fireflies','morel','warbler','fawn season','fall color']
  };
  const periodConflicts={
    dawn:['midday','after dark','night runs','last light','dusk'],
    morning:['after dark','night runs','last light','dusk'],
    midday:['after dark','night runs','first light','dawn'],
    afternoon:['after dark','night runs','first light','dawn'],
    dusk:['first light','midday','morning settles'],
    night:['first light','dock coffee','midday','afternoon starts']
  };
  if((seasonConflicts[s]||[]).some(k=>lc.includes(k)))return false;
  if((periodConflicts[p]||[]).some(k=>lc.includes(k)))return false;
  return true;
}
function looksRepetitive(text,mode){
  const recent=S.lineHistory.slice(-40);
  const badWords=['beautiful','amazing','perfect','magical','peaceful','serene'];
  const toks=tokenize(text);
  if(toks.filter(t=>badWords.includes(t)).length>0)return true;
  if(S.recentOpeners.slice(-16).includes(opener(text)))return true;
  if(S.modeHistory.slice(-2).every(m=>m===mode))return true;
  if(!lineFitsCurrentContext(text))return true;
  return recent.some(r=>lineSimilarity(r,text)>0.42);
}
function modeOrder(count){
  const pool=[];
  Object.entries(MODE_WEIGHTS).forEach(([k,v])=>{for(let i=0;i<v;i++)pool.push(k);});
  const out=[];
  while(out.length<count&&pool.length){
    let choice=pick(pool),tries=0;
    while(out.length>=2&&out[out.length-1]===choice&&out[out.length-2]===choice&&tries<20){
      choice=pick(pool);tries++;
    }
    out.push(choice);
  }
  return out;
}
function pressureMeaning(){
  const tr=pTrend();
  if(tr==='falling')return'Pressure dropped. Usually changes things.';
  if(tr==='rising')return'Pressure came back some.';
  return'Pressure stayed level.';
}
function memoryCallbackPool(){
  const now=Date.now();
  return(S.memory.callbacks||[])
    .filter(c=>now-c.at>20*60*1000)
    .map(c=>c.text);
}
function updateMemory(){
  if(!S.weather)return;
  const now=Date.now();
  const currentPressureTrend=pTrend();

  if(S.memory.windDir!==null){
    const dirChanged=Math.abs(S.weather.wind_direction_10m-S.memory.windDir)>35;
    const speedChanged=Math.abs(S.weather.wind_speed_10m-S.memory.windSpeed)>=4;
    if(dirChanged||speedChanged){
      S.memory.callbacks.push({type:'wind_shift',at:now,text:'Wind changed earlier. Never really settled.'});
    }
  }

  if(S.memory.pressureTrend!==null&&S.memory.pressureTrend!==currentPressureTrend){
    S.memory.callbacks.push({
      type:'pressure_shift',
      at:now,
      text:currentPressureTrend==='falling'
        ?'Pressure turned and stayed unsettled.'
        :currentPressureTrend==='rising'
        ?'Pressure recovered a bit.'
        :'Pressure leveled out.'
    });
  }

  if(S.memory.weatherCode!==null&&S.memory.weatherCode!==S.weather.weather_code){
    S.memory.callbacks.push({type:'sky_shift',at:now,text:'Sky changed since earlier.'});
  }

  if(S.memory.temp!==null&&Math.abs(S.weather.temperature_2m-S.memory.temp)>=5){
    S.memory.callbacks.push({
      type:'temp_shift',
      at:now,
      text:S.weather.temperature_2m>S.memory.temp?'It warmed up a bit.':'Temperature dropped off some.'
    });
  }

  S.memory.windDir=S.weather.wind_direction_10m;
  S.memory.windSpeed=S.weather.wind_speed_10m;
  S.memory.pressureTrend=currentPressureTrend;
  S.memory.weatherCode=S.weather.weather_code;
  S.memory.temp=S.weather.temperature_2m;
  S.memory.callbacks=S.memory.callbacks.filter(c=>now-c.at<3*60*60*1000).slice(-10);
}
function lessonPool(){
  const out=[];
  const p=period(),s=season();
  if(S.weather){
    if(S.weather.wind_speed_10m>=10)out.push('Wind in the tops usually tells you more than the ground does.');
    if([61,63,65,80,81,82].includes(S.weather.weather_code))out.push('Rain usually pulls smaller movement tighter to cover.');
    if(S.weather.temperature_2m<=35)out.push('Cold air carries sound farther.');
    if(S.weather.temperature_2m>=75)out.push('Heat flattens the middle of the day first.');
  }
  if(p==='dusk')out.push('Last light usually compresses things into a shorter window.');
  if(p==='night')out.push('After dark, sound usually reads the place faster than sight.');
  if(s==='autumn')out.push('In fall, edges matter more once light starts dropping.');
  if(s==='winter')out.push('Fresh cold makes small sound travel farther through the trees.');
  return out;
}
function parseFc(h){
  if(!h||!h.time)return[];
  const now=new Date(),r=[];
  for(let i=0;i<h.time.length&&r.length<6;i++){
    const t=new Date(h.time[i]);
    if(t>now){
      r.push({
        hoursOut:Math.round((t-now)/3600000),
        temp:h.temperature_2m[i],
        code:h.weather_code[i],
        precipProb:h.precipitation_probability[i],
        wind:h.wind_speed_10m[i]
      });
    }
  }
  return r;
}
function fcInsight(){
  const fc=S.forecast||[];
  if(!fc.length||!S.weather)return null;
  const rain=fc.find(h=>h.precipProb>50);
  if(rain){
    const l=rain.code>=95?'Storm':rain.code>=61?'Rain':'Drizzle';
    return`${l} looks more likely ${rain.hoursOut<=1?'soon':'later on'}.`;
  }
  const later=fc[Math.min(fc.length-1,3)];
  if(later){
    const drop=S.weather.temperature_2m-later.temp;
    if(drop>8)return`Air drops about ${drop.toFixed(0)}° later.`;
    if(drop<-8)return`Warms up about ${Math.abs(drop).toFixed(0)}° later.`;
    if(later.wind-S.weather.wind_speed_10m>6)return'Wind builds later.';
  }
  return null;
}
function airLabel(aqi){
  if(aqi==null||Number.isNaN(aqi))return null;
  if(aqi<=50)return'Air quality clear';
  if(aqi<=100)return'Air quality moderate';
  if(aqi<=150)return'Air quality rough for sensitive groups';
  return'Air quality degraded';
}
function skyNarrative(){
  if(!S.weather)return[];
  const code=S.weather.weather_code;
  if([0,1].includes(code))return['Sky opened up for now.','Light is cleaner with the clouds off it.'];
  if([2,3].includes(code))return['Flat sky. Harder to read things under it.','Cloud cover is doing most of the mood work right now.'];
  if([45,48].includes(code))return['Fog shortens the scene.','The air is hiding more than usual.'];
  if([61,63,65,80,81,82].includes(code))return['Rain changes the pace fast.','Wet weather pushes things tighter to cover.'];
  if([71,73,75,77].includes(code))return['Snow changes the ground story fast.','Fresh snow makes every track matter more.'];
  return[];
}
function fieldObservationPool(){
  const out=[];
  if(S.weather){
    out.push(`Sitting at ${S.weather.temperature_2m.toFixed(0)}° with ${skyL(S.weather.weather_code,S.weather.cloud_cover).toLowerCase()} overhead.`);
    out.push(`Wind ${S.weather.wind_speed_10m.toFixed(0)} mph ${compassDir(S.weather.wind_direction_10m)}.`);
    out.push(`Pressure ${pTrend()} at ${(S.weather.pressure_msl*0.02953).toFixed(2)} inHg.`);
    if(S.weather.wind_speed_10m<4)out.push('Not much on the ground. Tops are doing more.');
    if(S.weather.wind_speed_10m>=4&&S.weather.wind_speed_10m<10)out.push('Leaves are moving enough to hide small shifts.');
    if(S.weather.wind_speed_10m>=10)out.push('Canopy is busy enough to cover a lot.');
  }
  out.push(...skyNarrative());
  out.push(...(TIME_LOCAL_LINES[period()]||[]));
  return out;
}
function behaviorInsightPool(){
  const out=[pressureMeaning()];
  const fci=fcInsight();
  if(fci)out.push(fci);
  out.push(...memoryCallbackPool());
  if(S.weather&&S.weather.wind_speed_10m<6)out.push('Lower wind usually makes things easier to read.');
  if(S.weather&&S.weather.wind_speed_10m>12)out.push('Wind like this hides more than it shows.');
  if(period()==='dawn'||period()==='dusk')out.push('This light window usually does more with less.');
  if(period()==='midday')out.push('Midday usually flattens things unless weather shifts.');
  return out;
}
function northernContextPool(){
  return[...REGIONAL_CONTEXT,...shuffle(DESTINATION_LINES).slice(0,4),...phenNow().map(p=>p.n)];
}
function lifestylePool(){
  return[
    ...(LIFESTYLE_LINES[season()]||[]),
    'Up here, being in the right spot saves more time than people expect.',
    'Close towns matter more here than people think.',
    'Some days the lake carries the plan. Some days the woods do.',
    'Could sit here a while.'
  ];
}
function quietNarrativePool(){
  const elder=normalizeElderLines(S.elderPool).map(x=>x.text).filter(lineFitsCurrentContext);
  // AI lines are the primary source — only mix in fallback seasonals if pool is thin
  if(elder.length>=3)return elder;
  const seasonals=(FIELD_JOURNAL_LINES[period()]||[]).concat(FIELD_JOURNAL_LINES.all||[]);
  const lessons=Math.random()<0.35?lessonPool():[];
  return elder.concat(seasonals,lessons);
}
function extraDataItems(){
  const items=[];
  const moon=SunCalc.getMoonIllumination(new Date());
  items.push({t:`${moonName(moon.phase)} · ${(moon.fraction*100).toFixed(0)}% illuminated.`,type:'astro'});
  if(S.air&&S.air.us_aqi!=null)items.push({t:`AQI ${Math.round(S.air.us_aqi)} · ${airLabel(Math.round(S.air.us_aqi))}.`,type:'air'});
  if(S.weather)items.push({t:`Wind feel · ${windL(S.weather.wind_speed_10m)}.`,type:'windfeel'});
  return items;
}
function candidateFromMode(mode){
  let pool=[];
  if(mode==='field_observation')pool=fieldObservationPool();
  if(mode==='behavior_insight'){const bp=behaviorInsightPool();if(!bp||!bp.length)return null;pool=bp;}
  if(mode==='northern_context')pool=northernContextPool();
  if(mode==='lifestyle_trigger')pool=lifestylePool();
  if(mode==='quiet_narrative')pool=quietNarrativePool();
  if(!pool||!pool.length)return null;
  pool=shuffle(pool).filter(lineFitsCurrentContext);
  for(const raw of pool){
    const t=dialNarrator(raw);
    if(!looksRepetitive(t,mode))return{t,mode,dim:mode==='quiet_narrative',live:mode==='field_observation'||mode==='northern_context'};
  }
  const fallback=pool.find(Boolean);
  return fallback?{t:dialNarrator(fallback),mode,dim:mode==='quiet_narrative',live:mode==='field_observation'||mode==='northern_context'}:null;
}
function buildMarquee(){
  const items=[];
  const dataItems=extraDataItems();

  if(S.weather){
    items.push({t:`${S.weather.temperature_2m.toFixed(0)}F · ${skyL(S.weather.weather_code,S.weather.cloud_cover)}.`,type:'headline',live:true});
    items.push({t:`Wind ${S.weather.wind_speed_10m<1?'calm':`${S.weather.wind_speed_10m.toFixed(0)} mph ${compassDir(S.weather.wind_direction_10m)}`}.`,type:'wind'});
  }

  shuffle(dataItems).slice(0,1).forEach(i=>items.push(i));
  modeOrder(6).forEach(mode=>{
    const cand=candidateFromMode(mode);
    if(cand)items.push(cand);
  });

  const deduped=[];
  for(const item of items){
    if(!item||!item.t)continue;
    const prev=deduped[deduped.length-1];
    if(prev&&lineSimilarity(prev.t,item.t)>0.44)continue;
    deduped.push(item);
    rememberLine(item);
  }

  const track=document.getElementById('bar-track');
  if(!track)return;
  const html=deduped.map(i=>`<span class="bar-item${i.live?' live':i.dim?' dim':''}">${i.t}</span><span class="bar-sep"> · </span>`).join('');
  track.innerHTML=html+html;

  requestAnimationFrame(()=>{
    const fullW=track.scrollWidth/2;
    const speed=120;
    const dur=fullW/speed;
    track.style.animationDuration=`${dur}s`;
  });
}
function updateClock(){
  const now=new Date(),h=now.getHours(),disp=h%12||12,ampm=h>=12?'PM':'AM';
  document.getElementById('clock').textContent=`${disp}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ${ampm}`;
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('bar-date').textContent=`${M[now.getMonth()]} ${now.getDate()}`;
  checkMilestones(now);
  updateWOI(now);
}
function checkMilestones(now){
  const el=Math.floor((now-S.sessionStart)/60000);
  MILESTONES.forEach(m=>{
    if(el>=m.min&&!S.milestones.has(m.min)){
      S.milestones.add(m.min);
      setTimeout(()=>{
        if(S.centerBusy)return;
        document.getElementById('ms-text').textContent=m.text;
        showC(document.getElementById('milestone'),6000);
      },3000);
    }
  });
}
function updateWOI(now){
  const times=SunCalc.getTimes(now,LAT,LON);
  const msr=(times.sunrise-now)/60000,mss=(times.sunset-now)/60000,h=now.getHours(),el=document.getElementById('window-interest');
  function set(ey,main,sub,count){
    document.getElementById('wi-eyebrow').textContent=ey;
    document.getElementById('wi-main').textContent=main;
    document.getElementById('wi-sub').textContent=sub;
    document.getElementById('wi-count').textContent=count;
    el.classList.add('active');
  }
  if(h>=5&&h<8&&msr<10){set('Peak Window','Dawn — active','Most active period of the morning','');return;}
  if(h>=17&&h<20&&mss>-30&&mss<20){set('Peak Window','Dusk — active','Most active period of the day','');return;}
  if(msr>0&&msr<40){const m=Math.floor(msr),s=Math.floor((msr-m)*60);set('Dawn Window','Light opening','Things usually change at first light',`${m}:${pad(s)}`);return;}
  if(mss>0&&mss<50){const m=Math.floor(mss),s=Math.floor((mss-m)*60);set('Dusk Window','Last light coming','This window usually shortens fast',`${m}:${pad(s)}`);return;}
  el.classList.remove('active');
}
async function updateWeather(){
  try{
    const [wr,aqr]=await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,wind_speed_10m,wind_direction_10m,pressure_msl,cloud_cover,weather_code&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FDetroit&forecast_days=1`),
      fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=us_aqi,pm10,pm2_5,ozone&timezone=America%2FDetroit`)
    ]);
    const d=await wr.json(),c=d.current;
    S.weather=c;
    S.pressureTrend.push({t:Date.now(),p:c.pressure_msl});
    if(S.pressureTrend.length>8)S.pressureTrend.shift();
    S.forecast=parseFc(d.hourly);
    try{
      const aq=await aqr.json();
      if(aq&&aq.current)S.air=aq.current;
    }catch(e){}
    updateMemory();
    buildMarquee();
  }catch(e){
    console.warn('weather',e);
  }
}
async function updateNOAA(){
  try{
    const r=await fetch(`https://api.weather.gov/alerts/active?zone=${NOAA_ZONE}`,{
      headers:{'Accept':'application/geo+json','User-Agent':'backyard-overlay/9'}
    });
    const d=await r.json();
    const a=(d.features||[]).filter(f=>['Warning','Watch','Advisory'].some(t=>f.properties.event.includes(t)));
    const bar=document.getElementById('noaa-bar');
    if(a.length){
      document.getElementById('noaa-text').textContent=a[0].properties.event.toUpperCase();
      bar.classList.add('active');
    }else{
      bar.classList.remove('active');
    }
  }catch(e){}
}
async function hydrateElder(){
  if(!S.weather)return;
  try{
    const ctx={
      location:'Higgins Lake, Roscommon County, Michigan',
      period:period(),
      season:season(),
      weather:{
        temp_f:S.weather.temperature_2m,
        wind_mph:S.weather.wind_speed_10m,
        wind_dir:compassDir(S.weather.wind_direction_10m),
        sky:skyL(S.weather.weather_code,S.weather.cloud_cover),
        pressure_trend:pTrend()
      },
      forecast:(S.forecast||[]).slice(0,4),
      phenology:phenNow().map(p=>p.n).slice(0,2),
      recent_lines:S.lineHistory.slice(-40),
      memory_callbacks:(S.memory.callbacks||[]).slice(-6).map(c=>c.text)
    };

    const r=await fetch(ELDER_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(ctx)
    });

    if(!r.ok)throw new Error(r.status);
    const data=await r.json();
    if(Array.isArray(data.lines)&&data.lines.length){
      S.elderPool=normalizeElderLines(data.lines);
      buildMarquee();
    }
  }catch(e){
    console.warn('elder fallback',e);
  }
}

/* INIT */
scaleOverlay();
window.addEventListener('resize',scaleOverlay);
if(window.location.search.includes('debug'))document.body.classList.add('debug');

updateClock();
setInterval(updateClock,1000);

updateWeather();
setInterval(updateWeather,6*60*1000);

updateNOAA();
setInterval(updateNOAA,15*60*1000);

setTimeout(()=>{
  hydrateElder();
  setInterval(hydrateElder,2*60*1000);
},10000);

buildMarquee();
</script>
