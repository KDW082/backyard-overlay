<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Northern Michigan's Backyard</title>
<meta name="viewport" content="width=1920, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

html {
  width: 100%;
  height: 100%;
}

body {
  width: 1920px;
  height: 1080px;
  background: transparent;
  overflow: hidden;
  font-family: 'Inter', -apple-system, Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
  color: #fff;
  transform-origin: top left;
}

/* Debug mode: add ?debug to URL */
body.debug-mode {
  background: #141a14 !important;
}
body.debug-mode .right-data { opacity: 1 !important; }

:root {
  --w95: rgba(255,255,255,0.95);
  --w80: rgba(255,255,255,0.80);
  --w60: rgba(255,255,255,0.60);
  --w40: rgba(255,255,255,0.40);
  --w20: rgba(255,255,255,0.20);
  --w10: rgba(255,255,255,0.10);
  --gold: rgba(218,172,72,0.95);
  --gold-dim: rgba(218,172,72,0.55);
  --rare: rgba(130,200,162,0.95);
  --alert: rgba(215,75,55,1);
  --ts:  0 1px 8px rgba(0,0,0,1), 0 0 22px rgba(0,0,0,0.9), 0 2px 3px rgba(0,0,0,1);
  --ts2: 0 1px 6px rgba(0,0,0,0.95), 0 0 14px rgba(0,0,0,0.7);
  --ts3: 0 1px 5px rgba(0,0,0,0.85);
}

/* Night mode — applies after 10pm */
body.night-mode {
  --w95: rgba(220,215,200,0.90);
  --w80: rgba(220,215,200,0.65);
  --w60: rgba(220,215,200,0.48);
  --w40: rgba(220,215,200,0.30);
}

/* ── TOP LEFT ─────────────────────────────────── */
.top-left {
  position: absolute;
  top: 30px; left: 34px;
}
.top-left .name {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 19px;
  font-style: italic;
  font-weight: 400;
  color: var(--w80);
  letter-spacing: 0.01em;
  text-shadow: var(--ts);
  line-height: 1;
}
.top-left .loc {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--w40);
  text-shadow: var(--ts3);
  margin-top: 6px;
}
/* Session record — below identity */
.top-left .session-record {
  font-size: 11px;
  font-weight: 400;
  color: var(--w40);
  letter-spacing: 0.06em;
  text-shadow: var(--ts3);
  margin-top: 8px;
  font-variant-numeric: tabular-nums;
}
.top-left .session-record .count {
  color: var(--gold-dim);
  font-weight: 600;
}

/* ── TOP RIGHT ────────────────────────────────── */
.top-right {
  position: absolute;
  top: 28px; right: 34px;
  text-align: right;
}
/* Clock — smaller, not dominant */
.top-right .clock {
  font-size: 30px;
  font-weight: 300;
  color: var(--w80);
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
  text-shadow: var(--ts2);
  line-height: 1;
}
.top-right .weather-line {
  font-size: 15px;
  font-weight: 400;
  color: var(--w60);
  letter-spacing: 0.04em;
  text-shadow: var(--ts2);
  margin-top: 5px;
}
.top-right .dateline {
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--w40);
  text-shadow: var(--ts3);
  margin-top: 4px;
}

/* ── RIGHT SIDE DATA ──────────────────────────── */
.right-data {
  position: absolute;
  top: 50%; right: 34px;
  transform: translateY(-50%);
  text-align: right;
  opacity: 0;
  transition: opacity 2s ease;
}
.right-data.loaded { opacity: 1; }
.right-data .dr { margin-bottom: 12px; }
.right-data .dr-lbl {
  font-size: 9px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--w40); text-shadow: var(--ts3);
  margin-bottom: 2px;
}
.right-data .dr-val {
  font-size: 13px; font-weight: 400;
  color: var(--w60); letter-spacing: 0.04em;
  text-shadow: var(--ts3);
}

/* ── WEATHER DRAMA STRIP (top center, conditional) ── */
.weather-drama {
  position: absolute;
  top: 22px; left: 50%;
  transform: translateX(-50%);
  text-align: center;
  opacity: 0; transition: opacity 2s ease;
  pointer-events: none;
  z-index: 5;
}
.weather-drama.active { opacity: 1; }
.weather-drama .wd-main {
  font-size: 13px; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--gold); text-shadow: var(--ts);
}
.weather-drama .wd-sub {
  font-size: 11px; font-weight: 400;
  color: var(--w60); letter-spacing: 0.08em;
  text-shadow: var(--ts3); margin-top: 3px;
}

/* ── NOAA ─────────────────────────────────────── */
.noaa-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  background: rgba(200,60,40,0.18);
  border-bottom: 1px solid rgba(200,60,40,0.30);
  padding: 8px 34px;
  display: none; align-items: center; gap: 14px;
  z-index: 30;
}
.noaa-bar.active { display: flex; }
.noaa-bar .nb-lbl { font-size:10px; font-weight:700; letter-spacing:0.26em; text-transform:uppercase; color:rgba(215,75,55,0.80); }
.noaa-bar .nb-txt { font-size:14px; font-weight:600; color:var(--alert); letter-spacing:0.04em; }

/* ── SEASONAL STORY ARC (top center, below drama) ── */
.seasonal-arc {
  position: absolute;
  top: 80px; left: 50%;
  transform: translateX(-50%);
  text-align: center;
  opacity: 0; transition: opacity 2s ease;
  pointer-events: none;
}
.seasonal-arc.visible { opacity: 1; }
.seasonal-arc .sa-text {
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--w40); text-shadow: var(--ts3);
}

/* ── WINDOW OF INTEREST (center, pre-dawn/dusk) ── */
.window-interest {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -60%);
  text-align: center;
  opacity: 0; transition: opacity 1.8s ease;
  pointer-events: none; z-index: 5;
}
.window-interest.active { opacity: 1; }
.window-interest .wi-eyebrow {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.32em; text-transform: uppercase;
  color: var(--gold-dim); text-shadow: var(--ts3);
  margin-bottom: 8px;
}
.window-interest .wi-main {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 38px; font-style: italic; font-weight: 400;
  color: var(--w95); line-height: 1.2;
  text-shadow: 0 2px 16px rgba(0,0,0,1), 0 0 40px rgba(0,0,0,0.9);
  letter-spacing: 0.01em;
}
.window-interest .wi-sub {
  font-size: 13px; font-weight: 400;
  letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--w60); text-shadow: var(--ts2);
  margin-top: 10px;
}
.window-interest .wi-countdown {
  font-size: 28px; font-weight: 300;
  color: var(--gold); text-shadow: var(--ts);
  margin-top: 6px; font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
}

/* ── RARE EVENT BANNER ────────────────────────── */
.rare-banner {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 780px; text-align: center;
  background: rgba(0,0,0,0.76);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(130,200,162,0.18);
  border-top: 2px solid rgba(130,200,162,0.40);
  padding: 36px 56px 32px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.5s ease; z-index: 20;
}
.rare-banner.active { opacity: 1; }
.rare-banner .rb-cat {
  font-size: 10px; font-weight: 600; letter-spacing: 0.36em;
  text-transform: uppercase; color: rgba(130,200,162,0.60);
  text-shadow: var(--ts2); margin-bottom: 14px;
  padding-bottom: 12px; border-bottom: 1px solid rgba(130,200,162,0.12);
}
.rare-banner .rb-main {
  font-size: 22px; font-weight: 500; color: var(--w95);
  line-height: 1.4; text-shadow: var(--ts); letter-spacing: 0.01em;
}
.rare-banner .rb-sub {
  font-size: 14px; font-weight: 400; color: var(--w60);
  margin-top: 10px; line-height: 1.5; text-shadow: var(--ts2);
}
.rare-banner .rb-ts {
  font-size: 10px; font-weight: 500; letter-spacing: 0.22em;
  text-transform: uppercase; color: rgba(130,200,162,0.50);
  margin-top: 18px; text-shadow: var(--ts3);
}

/* ── MYSTERY JOURNAL (center, slow-burn) ─────── */
.journal-entry {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 680px; text-align: center;
  opacity: 0; pointer-events: none;
  transition: opacity 1.2s ease; z-index: 10;
}
.journal-entry.active { opacity: 1; }
.journal-entry .je-text {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic; font-size: 24px; font-weight: 400;
  color: var(--w80); line-height: 1.45;
  text-shadow: 0 1px 10px rgba(0,0,0,1), 0 0 30px rgba(0,0,0,0.85);
  letter-spacing: 0.01em;
}
.journal-entry .je-attr {
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--w40); text-shadow: var(--ts3);
  margin-top: 12px;
}

/* ── MILESTONE FLASH (center, brief) ─────────── */
.milestone {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.8s ease; z-index: 15;
}
.milestone.active { opacity: 1; }
.milestone .ms-text {
  font-size: 14px; font-weight: 400;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--w60); text-shadow: var(--ts2);
}

/* ── BOTTOM LEFT — STATE MODULE ───────────────── */
.bottom-left {
  position: absolute;
  bottom: 72px; left: 34px;
  width: 540px;
}
/* State — primary voice, dominant */
.bottom-left .ev-type {
  font-size: 26px; font-weight: 600;
  color: var(--w95); letter-spacing: 0.01em;
  text-shadow: var(--ts); line-height: 1.1;
}
.bottom-left .ev-type.state-build      { color: rgba(218,172,72,0.98); }
.bottom-left .ev-type.state-active     { color: rgba(255,255,255,0.98); }
.bottom-left .ev-type.state-lull       { color: rgba(255,255,255,0.78); }
.bottom-left .ev-type.state-quiet      { color: rgba(255,255,255,0.72); }
.bottom-left .ev-type.state-transition { color: rgba(218,172,72,0.88); }
.bottom-left .ev-type.state-drama      { color: rgba(218,172,72,1); }
.bottom-left .ev-type.state-night      { color: rgba(200,215,235,0.90); }
.bottom-left .ev-type.rare             { color: var(--rare); }

.bottom-left .ev-context {
  font-size: 14px; font-weight: 400;
  color: rgba(255,255,255,0.90); letter-spacing: 0.02em;
  text-shadow: var(--ts); margin-top: 6px;
  line-height: 1.45;
}
.bottom-left .ev-ago {
  font-size: 12px; font-weight: 500;
  color: var(--w40); letter-spacing: 0.08em;
  text-shadow: var(--ts3); margin-top: 8px;
  font-variant-numeric: tabular-nums;
}

/* ── BOTTOM CENTER — QUOTE / JOURNAL ─────────── */
.bottom-center {
  position: absolute;
  bottom: 68px; left: 50%;
  transform: translateX(-50%);
  width: 740px; text-align: center;
}
.bottom-center .quote {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic; font-size: 22px; font-weight: 400;
  color: var(--w95); line-height: 1.4; letter-spacing: 0.01em;
  text-shadow: 0 1px 8px rgba(0,0,0,0.95), 0 0 24px rgba(0,0,0,0.7);
  transition: opacity 1.4s ease;
}
.bottom-center .quote.fade { opacity: 0; }

/* ── TICKER ───────────────────────────────────── */
.ticker-wrap {
  position: absolute;
  bottom: 0; left: 0; right: 0; height: 40px;
  overflow: hidden;
  background: rgba(0,0,0,0.45);
  border-top: 1px solid rgba(255,255,255,0.12);
  display: flex; align-items: center;
}
.ticker-track {
  display: flex; white-space: nowrap;
  animation: tick 80s linear infinite;
  will-change: transform;
}
@keyframes tick { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
.ticker-item {
  font-size: 12px; font-weight: 400;
  color: var(--w80); letter-spacing: 0.06em;
  padding: 0 52px; text-shadow: var(--ts3);
}
.ticker-dot { color: var(--w20); }

/* ── NIGHT MODE OVERLAY ───────────────────────── */
body.night-mode .top-left .name { color: rgba(200,210,225,0.80); }
body.night-mode .top-right .clock { color: rgba(200,210,225,0.85); }
body.night-mode .ticker-wrap { background: rgba(0,0,0,0.40); }

/* ── DEBUG MODE — force all content visible ───── */
body.debug-mode .right-data,
body.debug-mode .bottom-left .ev-type,
body.debug-mode .bottom-left .ev-context,
body.debug-mode .bottom-center .quote,
body.debug-mode .seasonal-arc { opacity: 1 !important; }
</style>
</head>
<body>

<div class="noaa-bar" id="noaa-bar">
  <span class="nb-lbl">NWS Advisory</span>
  <span class="nb-txt" id="noaa-text">—</span>
</div>

<!-- TOP LEFT: identity + session record -->
<div class="top-left">
  <div class="name">Northern Michigan's Backyard</div>
</div>

<!-- TOP RIGHT: clock (smaller) + conditions -->
<div class="top-right">
  <div class="clock" id="clock">—</div>
  <div class="weather-line" id="weather-line">—</div>
  <div class="dateline" id="dateline">—</div>
</div>

<!-- RIGHT SIDE DATA -->
<div class="right-data" id="right-data">
  <div class="dr"><div class="dr-lbl">Moon</div><div class="dr-val" id="moon-val">—</div></div>
  <div class="dr"><div class="dr-lbl">Pressure</div><div class="dr-val" id="pressure-val">—</div></div>
  <div class="dr"><div class="dr-lbl">Wind</div><div class="dr-val" id="wind-val">—</div></div>
  <div class="dr"><div class="dr-lbl">Solar</div><div class="dr-val" id="solar-val">—</div></div>
</div>

<!-- WEATHER DRAMA (top center, pressure-triggered) -->
<div class="weather-drama" id="weather-drama">
  <div class="wd-main" id="wd-main">—</div>
  <div class="wd-sub" id="wd-sub">—</div>
</div>

<!-- SEASONAL ARC (top center, below drama) -->
<div class="seasonal-arc" id="seasonal-arc">
  <div class="sa-text" id="sa-text">—</div>
</div>

<!-- WINDOW OF INTEREST (center, dawn/dusk approach) -->
<div class="window-interest" id="window-interest">
  <div class="wi-eyebrow" id="wi-eyebrow">—</div>
  <div class="wi-main" id="wi-main">—</div>
  <div class="wi-sub" id="wi-sub">—</div>
  <div class="wi-countdown" id="wi-countdown">—</div>
</div>

<!-- MYSTERY JOURNAL (center, slow-burn) -->
<div class="journal-entry" id="journal-entry">
  <div class="je-text" id="je-text">—</div>
  <div class="je-attr" id="je-attr">—</div>
</div>

<!-- MILESTONE (center, brief) -->
<div class="milestone" id="milestone">
  <div class="ms-text" id="ms-text">—</div>
</div>

<!-- RARE EVENT BANNER -->
<div class="rare-banner" id="rare-banner">
  <div class="rb-cat" id="rb-cat">—</div>
  <div class="rb-main" id="rb-main">—</div>
  <div class="rb-sub" id="rb-sub">—</div>
  <div class="rb-ts" id="rb-ts">—</div>
</div>

<!-- BOTTOM LEFT: state module -->
<div class="bottom-left">
  <div class="ev-type" id="ev-type"></div>
  <div class="ev-context" id="ev-context"></div>
  <div class="ev-ago" id="ev-ago"></div>
</div>

<!-- BOTTOM CENTER: elder quote -->
<div class="bottom-center">
  <div class="quote" id="quote">—</div>
</div>

<!-- TICKER -->
<div class="ticker-wrap">
  <div class="ticker-track" id="ticker-track"></div>
</div>

<script>
/* ================================================================
   NORTHERN MICHIGAN'S BACKYARD v8
   ================================================================ */

const LAT = 44.48, LON = -84.72;
const ELDER_ENDPOINT = '/.netlify/functions/elder-voice';
const EBIRD_KEY = '';
const NOAA_ZONE = 'MIZ037';

// Scale overlay to fit any window size (OBS or browser)
function scaleOverlay() {
  const scaleX = window.innerWidth  / 1920;
  const scaleY = window.innerHeight / 1080;
  const scale  = Math.min(scaleX, scaleY);
  document.body.style.transform = `scale(${scale})`;
  document.body.style.marginLeft = `${(window.innerWidth  - 1920 * scale) / 2}px`;
  document.body.style.marginTop  = `${(window.innerHeight - 1080 * scale) / 2}px`;
}
scaleOverlay();
window.addEventListener('resize', scaleOverlay);

// Debug mode — add ?debug to URL for dark background in browser
if (window.location.search.includes('debug')) {
  document.body.classList.add('debug-mode');
}

// ── SESSION STATE ──────────────────────────────
const S = {
  weather: null,
  forecast: [],
  elderPool: [],
  lastElderIdx: -1,
  sessionStart: Date.now(),
  eventCount: 0,
  eventStreak: 0,
  lastEventAt: null,
  lastEventLabel: null,
  lastEventStateAtTime: null,
  feederQuietSince: Date.now() - 60000*(15+Math.floor(Math.random()*30)),
  feederActive: false,
  pressureTrend: [],
  rareLog: [],
  milestones: new Set(), // which session durations have been shown
  centerBusy: false,
  lastJournalAt: null,
  nightMode: false,
};

// ── UTILS ──────────────────────────────────────
function pad(n) { return String(n).padStart(2,'0'); }
function compassDir(deg) {
  return ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(deg/22.5)%16];
}
function fmtAgo(ms) {
  const s = Math.floor(ms/1000);
  return s < 60 ? `${s}s ago` : `${Math.floor(s/60)}m ${pad(s%60)}s ago`;
}
function currentPeriod() {
  const h = new Date().getHours();
  if (h<5) return 'night'; if (h<8) return 'dawn'; if (h<12) return 'morning';
  if (h<15) return 'midday'; if (h<19) return 'afternoon'; if (h<22) return 'dusk';
  return 'night';
}
function currentSeason() {
  const m = new Date().getMonth();
  if (m<2||m===11) return 'winter'; if (m<5) return 'spring';
  if (m<8) return 'summer'; return 'autumn';
}
function pressureTrend() {
  if (S.pressureTrend.length < 2) return 'stable';
  const d = S.pressureTrend[S.pressureTrend.length-1].p - S.pressureTrend[0].p;
  if (d > 2) return 'rising'; if (d < -2) return 'falling'; return 'stable';
}
function showCenter(el, duration, onDone) {
  if (S.centerBusy) return false;
  S.centerBusy = true;
  el.classList.add('active');
  setTimeout(() => {
    el.classList.remove('active');
    setTimeout(() => { S.centerBusy = false; if (onDone) onDone(); }, 1200);
  }, duration);
  return true;
}

// ── CLOCK + DATE + NIGHT MODE ──────────────────
function updateClock() {
  const now = new Date();
  const h = now.getHours();
  let disp = h % 12 || 12;
  const ampm = h >= 12 ? 'PM' : 'AM';
  document.getElementById('clock').textContent =
    `${disp}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ${ampm}`;

  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const doy = Math.floor((now - new Date(now.getFullYear(),0,0)) / 86400000);
  document.getElementById('dateline').textContent =
    `${months[now.getMonth()]} ${now.getDate()} · Day ${doy}`;

  // Night mode
  const night = h >= 22 || h < 5;
  if (night !== S.nightMode) {
    S.nightMode = night;
    document.body.classList.toggle('night-mode', night);
  }

  updateWindowOfInterest(now);
}
setInterval(updateClock, 1000);
updateClock();

// ── SOLAR + LUNAR ──────────────────────────────
function updateSolar() {
  const now = new Date();
  const sun = SunCalc.getPosition(now, LAT, LON);
  const moon = SunCalc.getMoonIllumination(now);
  const alt = sun.altitude * 180 / Math.PI;
  const label = alt < -12 ? 'Night'
    : alt < -6 ? 'Astro twilight'
    : alt < -0.833 ? (now < SunCalc.getTimes(now,LAT,LON).solarNoon ? 'Pre-dawn' : 'Dusk')
    : alt < 6 ? 'Golden hour'
    : alt < 20 ? 'Low sun' : 'Solar maximum';
  document.getElementById('solar-val').textContent = `${label} · ${alt>=0?'+':''}${alt.toFixed(1)}°`;
  const mp = moonName(moon.phase);
  document.getElementById('moon-val').textContent = `${mp} · ${(moon.fraction*100).toFixed(0)}%`;
  document.getElementById('right-data').classList.add('loaded');
}
function moonName(p) {
  if (p<0.03||p>0.97) return 'New Moon';
  if (p<0.22) return 'Waxing Crescent'; if (p<0.28) return 'First Quarter';
  if (p<0.47) return 'Waxing Gibbous'; if (p<0.53) return 'Full Moon';
  if (p<0.72) return 'Waning Gibbous'; if (p<0.78) return 'Last Quarter';
  return 'Waning Crescent';
}

      +`&forecast_days=1`
    );
    const d = await r.json(); const c = d.current;
    S.weather = c;

    // Parse next 4 hours of forecast
    S.forecast = parseForecast(d.hourly);

    S.pressureTrend.push({t:Date.now(), p:c.pressure_msl});
    if (S.pressureTrend.length > 8) S.pressureTrend.shift();

    document.getElementById('weather-line').textContent =
      `${c.temperature_2m.toFixed(0)}°F  ·  ${skyLabel(c.weather_code, c.cloud_cover)}`;
    document.getElementById('pressure-val').textContent =

    document.getElementById('wind-val').textContent =

  } catch(e) { console.warn('weather:', e); }

// Parse hourly forecast into next 4 hours
function parseForecast(hourly) {
  if (!hourly || !hourly.time) return [];
  const now = new Date();
  const currentHour = now.getHours();
  const results = [];
  for (let i = 0; i < hourly.time.length && results.length < 4; i++) {
    const t = new Date(hourly.time[i]);
    if (t > now) {
      const hoursOut = Math.round((t - now) / 3600000);
      results.push({
        hoursOut,
        temp: hourly.temperature_2m[i],
        code: hourly.weather_code[i],
        precipProb: hourly.precipitation_probability[i],
        wind: hourly.wind_speed_10m[i],
        time: t,
      });
    }
  }
  return results;
}

// Get the most significant forecast event in next 4 hrs
function forecastInsight() {
  const fc = S.forecast || [];
  if (!fc.length) return null;

  // Rain/storm incoming
  const rain = fc.find(h => h.precipProb > 50);
  if (rain) {
    const hrs = rain.hoursOut;
    const label = rain.code >= 95 ? 'Storm' : rain.code >= 61 ? 'Rain' : 'Drizzle';
    return `${label} likely in ${hrs === 1 ? 'about an hour' : `approximately ${hrs} hours`}`;
  }

  // Significant temp drop
  if (fc.length >= 2) {
    const tempDrop = S.weather.temperature_2m - fc[fc.length-1].temp;
    if (tempDrop > 8) return `Temperature dropping ${tempDrop.toFixed(0)}° over the next few hours`;
    if (tempDrop < -8) return `Temperature rising ${Math.abs(tempDrop).toFixed(0)}° through the afternoon`;
  }

  // Wind increase
  const windIncrease = fc.find(h => h.wind > (S.weather?.wind_speed_10m || 0) + 10);
  if (windIncrease) return `Wind increasing to ${windIncrease.wind.toFixed(0)} mph within ${windIncrease.hoursOut} hour${windIncrease.hoursOut > 1 ? 's' : ''}`;

  // Snow incoming
  const snow = fc.find(h => [71,73,75,77,85,86].includes(h.code));
  if (snow) return `Snow possible in approximately ${snow.hoursOut} hour${snow.hoursOut > 1 ? 's' : ''}`;

  return null;
}
function skyLabel(code, cloud) {
  if ([0].includes(code)) return 'Clear';
  if ([1].includes(code)) return 'Mainly clear';
  if ([2].includes(code)) return 'Partly cloudy';
  if ([3].includes(code)) return 'Overcast';
  if ([45,48].includes(code)) return 'Fog';
  if ([51,53,55,56,57].includes(code)) return 'Drizzle';
  if ([61,63,65,66,67,80,81,82].includes(code)) return 'Rain';
  if ([71,73,75,77,85,86].includes(code)) return 'Snow';
  if ([95,96,99].includes(code)) return 'Thunderstorm';
  return `${cloud}% cloud`;
}

function updateWindowOfInterest(now) {

  const minsToSunset  = (times.sunset  - now) / 60000;

  const main = document.getElementById('wi-main');
  const sub = document.getElementById('wi-sub');

  // Active dawn window

    eyebrow.textContent = 'Peak Movement Window';
    main.textContent = 'Dawn — active';
    sub.textContent = 'Most active period of the morning';
    countdown.textContent = '';
    el.classList.add('active');

  // Active dusk window
  if (h >= 17 && h < 20 && minsToSunset > -30 && minsToSunset < 20) {

    main.textContent = 'Dusk — active';
    sub.textContent = 'Most active period of the day';
    countdown.textContent = '';
    el.classList.add('active');
    return;
  }
  // Pre-dawn approach
  if (minsToSunrise > 0 && minsToSunrise < 40) {
    const mins = Math.floor(minsToSunrise);
    const secs = Math.floor((minsToSunrise - mins) * 60);
    eyebrow.textContent = 'Dawn Watch Window';
    main.textContent = 'Movement window opening';
    sub.textContent = 'Wildlife activity increases at first light';
    countdown.textContent = `${mins}:${pad(secs)}`;
    el.classList.add('active');
    return;
  }
  // Pre-dusk approach
  if (minsToSunset > 0 && minsToSunset < 50) {

// Data-aware slow-burn center entries — fires every 15-25 min
function buildJournalEntry() {
  const now = new Date();
  const h = now.getHours();
  let m = now.getMinutes(); if (m < 10) m = '0'+m;
  const period = currentPeriod();
  const trend = pressureTrend();
  const feederQuietMin = Math.floor((Date.now() - S.feederQuietSince) / 60000);
  const wind = S.weather ? S.weather.wind_speed_10m : 0;
  const temp = S.weather ? S.weather.temperature_2m.toFixed(0) : null;

  // Build a contextually aware entry from current real conditions
  const entries = [];

  // Feeder-based
  if (feederQuietMin > 30)
    entries.push(`The feeders have been quiet for ${feederQuietMin} minutes.`);
  if (feederQuietMin > 55)
    entries.push(`An hour of silence at the feeders. The next arrival tends to be notable.`);

  // Pressure-based
  if (trend === 'falling')
    entries.push(`The pressure has been dropping. Something in the forest already knows.`);
  if (trend === 'rising')
    entries.push(`Pressure climbing. The front has passed. Expect movement to resume.`);

  // Wind-based
  if (wind > 12)
    entries.push(`Wind in the upper canopy. Ground movement tends to follow when it drops.`);
  if (wind < 2 && h > 5 && h < 22)
    entries.push(`No wind. Sound carries further than usual right now.`);

  // Time-based
  if (period === 'midday')
    entries.push(`The forest goes quiet around this hour. It will come back.`);
  if (period === 'night')
    entries.push(`After midnight the forest runs on different rules.`);
  if (period === 'dawn')
    entries.push(`Something moved in the eastern stand before first light.`);

  // Temp-based
  if (temp && parseInt(temp) < 32)
    entries.push(`Below freezing. Ground is hard. Sound carries differently in cold air.`);
  if (temp && parseInt(temp) > 75)
    entries.push(`Warm for this region. Animals retreat to shade by late morning.`);

  // Session-based
  const sessionMin = Math.floor((Date.now() - S.sessionStart) / 60000);
  if (sessionMin > 30 && S.eventCount > 0)
    entries.push(`${S.eventCount} events logged this session. Most viewers leave before the next one.`);

  // Always-available season entries
  const season = currentSeason();
  const seasonEntries = {
    spring: [
      'Migration is moving through. Some of what you hear overhead will not be here tomorrow.',
      'The warblers pass through quickly. A week can change everything.',
    ],
    summer: [
      `The forest is at full leaf. Animals use the cover differently than in spring.`,
      `Fawn season. Does are nearby even when not visible.`,
    ],
    autumn: [
      `The rut changes everything about how deer move. Expected patterns no longer apply.`,
      `The light is leaving earlier each evening. The animals have already adjusted.`,
    ],
    winter: [
      `In deep winter, the feeders become the center of everything.`,
      `Tracks in fresh snow reveal a night most viewers never see.`,
    ],
  };
  entries.push(...(seasonEntries[season] || []));

  if (!entries.length)
    entries.push(`The forest is quiet. It tends not to stay that way.`);

  const pick = entries[Math.floor(Math.random() * entries.length)];
  return { text: pick, attr: `Field note · ${h%12||12}:${m} ${h>=12?'PM':'AM'}` };
}

const lastStateIdx = {};
function pickStateLine(sk, sub) {
  const pool = STATES[sk]?.[sub] || STATES[sk]?.default || Object.values(STATES[sk]||{})[0] || [{label:'—',meaning:'—'}];
  const key = `${sk}_${sub}`;
  let idx;
  do { idx = Math.floor(Math.random()*pool.length); }
  while (pool.length > 1 && idx === lastStateIdx[key]);
  lastStateIdx[key] = idx;
  return pool[idx];
}

function computeState() {
  const now = new Date();
  const h = now.getHours();
  const w = S.weather;
  const trend = pressureTrend();
  const feederQuietMin = Math.floor((Date.now()-S.feederQuietSince)/60000);
  const times = SunCalc.getTimes(now, LAT, LON);
  const minsToSunrise = (times.sunrise - now) / 60000;
  const minsToSunset  = (times.sunset  - now) / 60000;
  const period = currentPeriod();

  if (h < 5 || h >= 22) return { s:'NIGHT', sub:'default' };
  if (h >= 5 && h < 8 && minsToSunrise < 10) return { s:'ACTIVE', sub:'dawn' };
  if (h >= 17 && h < 20 && minsToSunset > -20 && minsToSunset < 30) return { s:'ACTIVE', sub:'dusk' };
  if (trend === 'falling' && feederQuietMin < 15) return { s:'DRAMA', sub:'falling' };
  if (trend === 'rising') return { s:'DRAMA', sub:'rising' };
  if (minsToSunrise > 0 && minsToSunrise < 40) return { s:'BUILD', sub:'pre_dawn' };
  if (minsToSunset > 0 && minsToSunset < 50) return { s:'BUILD', sub:'pre_dusk' };
  if (trend === 'falling') return { s:'BUILD', sub:'pressure_drop' };
  if (feederQuietMin > 45 && period !== 'night') return { s:'BUILD', sub:'post_quiet' };
  if (S.lastEventAt && Date.now()-S.lastEventAt < 8*60000 && S.lastEventStateAtTime === 'ACTIVE')
    return { s:'LULL', sub:'default' };
  if (h >= 6 && h < 7 || h >= 19 && h < 20) return { s:'TRANSITION', sub:'light' };
  if (h >= 11 && h < 15) return { s:'QUIET', sub:'midday' };
  return { s:'QUIET', sub:'default' };
}

function renderState() {
  const { s, sub } = computeState();
  const line = pickStateLine(s, sub);
  const typeEl = document.getElementById('ev-type');

}

    {cat:'Vocalization · unmatched', main:'Sound event · 2.8 seconds · no echo · bearing unresolved', sub:'Not attributed to known regional species. Not repeated.'},

};
const BIGFOOT = {
  cat:'Movement · classification unresolved',
  main:'Bipedal gait pattern · large mass estimate · western treeline',
  sub:'Duration: approximately 6 seconds. Gait inconsistent with known regional fauna. No further activity recorded.',
};

function fireRare(ev) {
  const period = currentPeriod();
  const pool = RARE[period]||RARE.night;
  const e = ev||pool[Math.floor(Math.random()*pool.length)];
  const now = new Date();
  const h = now.getHours(); const ap = h>=12?'PM':'AM';
  const ts = `${h%12||12}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ${ap}`;

  document.getElementById('rb-cat').textContent = e.cat;
  document.getElementById('rb-main').textContent = e.main;
  document.getElementById('rb-sub').textContent = e.sub;
  document.getElementById('rb-ts').textContent = `Logged · ${ts} · classification pending`;

  S.centerBusy = true;
  document.getElementById('rare-banner').classList.add('active');
  logEvent(e.cat);
  S.rareLog.push({ts, cat:e.cat});

  setTimeout(()=>{
    document.getElementById('rare-banner').classList.remove('active');
    setTimeout(()=>{ S.centerBusy=false; renderState(); }, 600);
  }, 26000);
}
function scheduleRare() {
  const h = new Date().getHours();
  const base = (h>=5&&h<8)||(h>=17&&h<20) ? 32 : h>=8&&h<17 ? 65 : 100;
  setTimeout(()=>{ fireRare(); scheduleRare(); }, (base+Math.random()*40)*60000);
}
scheduleRare();
function scheduleBigfoot() {
  setTimeout(()=>{ fireRare(BIGFOOT); scheduleBigfoot(); }, (420+Math.random()*180)*60000);
}
scheduleBigfoot();

// Claude hydration
async function hydrateElder() {
  if (!S.weather) return;
  try {
    const c = S.weather;
    const m = new Date().getMonth();
    const ctx = {
      location:'Higgins Lake, Roscommon County, Michigan',
      time: new Date().toISOString(),
      period: currentPeriod(),
      season: currentSeason(),
      weather:{
        temp_f:c.temperature_2m, wind_mph:c.wind_speed_10m,
        wind_dir:compassDir(c.wind_direction_10m), sky_code:c.weather_code,
        cloud_pct:c.cloud_cover, pressure_hpa:c.pressure_msl,
        pressure_trend:pressureTrend(),
      },
      phenology: activePhenology().map(p=>p.n).slice(0,2),
      rare_events_session: S.rareLog.length,
    };
    const r = await fetch(ELDER_ENDPOINT, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(ctx),
    });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    if (Array.isArray(data.lines)&&data.lines.length)
      S.elderPool = [...data.lines, ...ELDER_SEED];
  } catch(e) {}
}
setTimeout(()=>{ hydrateElder(); setInterval(hydrateElder,14*60*1000); }, 10000);

function buildTicker(weather) {

    items.unshift(`Roscommon, MI  ·  ${weather.temperature_2m.toFixed(0)}°F  ·  ${sky}`);

  {s:[1,15],e:[2,28],n:'Deep winter · chickadee and nuthatch primary feeder visitors'},
];
function activePhenology() {
  const now=new Date(),m=now.getMonth()+1,d=now.getDate();
  const n=(mo,da)=>mo*100+da,cur=n(m,d);
  return PHENOLOGY.filter(p=>{
    const s=n(p.s[0],p.s[1]),e=n(p.e[0],p.e[1]);
    return s<=e?cur>=s&&cur<=e:cur>=s||cur<=e;
  });
}
